:root{--k:1;--lf:Andika,system-ui,sans-serif;--lw:700;--lh:1.15;--bg:#FFF8EC;--card:#fff;--ink:#2B2A33;--muted:#6B6A75;--line:#E8DFCC;--v:#D9473A;--c:#2563B8;--ok:#2E9E5B;--okbg:#E3F5EA;--bad:#C0392B;--badbg:#FBE4E1;--acc:#F2A531;--accbg:#FFF0D6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Andika,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:8px;max-width:960px;margin:0 auto}
h1{font-size:26px;margin:0}
.sub{color:var(--muted);font-size:15px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:16px;min-width:44px}
.tb.man{font-family:'Manuscrita PT';font-size:17px}
html.fm-man{--lf:'Manuscrita PT',cursive;--lw:400;--lh:1.6}
html.fm-man .big{padding-bottom:.35em}
.rep{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-size:16px}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;max-width:960px;margin:0 auto}
.fase{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:16px}
.fase.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.fase.lock{color:var(--muted)}
main{max-width:960px;margin:0 auto;padding:8px 16px 40px}
.letras-fase{display:flex;gap:10px;justify-content:center;font-size:calc(40px*var(--k));font-family:var(--lf);font-weight:var(--lw);margin:6px 0 14px;flex-wrap:wrap}
.cv{color:var(--v)}.cc{color:var(--c)}.s0{color:var(--c)}.s1{color:var(--v)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2{margin:0;font-size:24px}
.sample{font-size:24px;font-family:var(--lf);font-weight:var(--lw)}
.bar{height:10px;background:#F1EADB;border-radius:6px;margin:12px 0 4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
.bar-l{font-size:13px;color:var(--muted);margin-bottom:10px}
.modes{display:grid;gap:8px}
.mode{border:0;border-radius:14px;padding:14px;font-size:18px;text-align:left}
.caixa{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cx{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 4px;font-family:var(--lf);font-size:24px;line-height:1.3;display:flex;flex-direction:column;align-items:center}
.cx small{font-family:Andika,system-ui,sans-serif;font-size:12px;color:var(--muted)}
.cx.on{border-color:var(--acc);background:var(--accbg)}
.m-ver{background:#E6F0FB}.m-esc{background:var(--accbg)}.m-con{background:#EDE7FA}
.msgbox{background:#fff;border:2px dashed var(--line);border-radius:20px;padding:40px 20px;text-align:center;font-size:22px;margin-top:20px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.home{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:16px}
.ttl{font-size:17px;color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.dot{width:14px;height:14px;border-radius:50%;background:#E9E0CD}.dot.done{background:var(--ok)}.dot.now{background:var(--acc)}
.ask{display:flex;justify-content:center}
.listen{width:92px;height:92px;border-radius:50%;border:0;background:var(--acc);font-size:42px;box-shadow:0 4px 0 #C98515}
.listen:active{transform:translateY(3px);box-shadow:0 1px 0 #C98515}
.pic{width:150px;height:150px;margin:6px auto}
.pic.small{width:110px;height:110px;min-height:110px}
.pic svg{width:100%;height:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:8px}
.opts-frases{grid-template-columns:1fr}

.opts-palavras .opt{font-size:calc(40px*var(--k))}.opts-frases .opt{font-size:calc(28px*var(--k));min-height:70px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);opacity:.5;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{min-width:90px;min-height:90px;border:3px dashed #CDBF9F;background:#fff;border-radius:16px;font-size:calc(42px*var(--k));font-family:var(--lf);font-weight:var(--lw);line-height:var(--lh);padding:6px 12px}
.slots-frases .slot{min-width:70px;min-height:64px;font-size:calc(28px*var(--k))}
.ponto{align-self:flex-end;font-size:calc(42px*var(--k));font-family:var(--lf);font-weight:var(--lw);padding:0 4px 8px}
.slot:not(.empty){border-style:solid;border-color:var(--c)}
.slot.wrongslot{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.slot.right{border-color:var(--ok);background:var(--okbg)}
.pieces{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.piece{min-width:80px;min-height:80px;border:3px solid var(--line);background:#FFFDF8;border-radius:16px;font-size:calc(38px*var(--k));font-family:var(--lf);font-weight:var(--lw);line-height:var(--lh);padding:6px 12px;box-shadow:0 3px 0 var(--line)}
.pieces-frases .piece{font-size:calc(26px*var(--k));min-height:60px}
.piece.used{opacity:.2}
.focus{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;text-align:center}
.big{background:none;border:0;font-family:var(--lf);font-weight:var(--lw);font-size:calc(clamp(70px,20vw,150px)*var(--k));line-height:calc(var(--lh) + .1);padding:0 10px;max-width:100%}
.big-palavras{font-size:calc(clamp(56px,14vw,110px)*var(--k))}.big-frases{font-size:calc(clamp(30px,7vw,52px)*var(--k))}
.upper{font-size:calc(30px*var(--k));font-family:var(--lf);font-weight:var(--lw);color:var(--muted)}
.parts{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.part{border:2px solid var(--line);background:#FFFDF8;border-radius:12px;padding:6px 12px;font-size:calc(28px*var(--k));font-family:var(--lf);font-weight:var(--lw);line-height:var(--lh)}
.part.whole{border-color:var(--acc)}
.plus{font-size:24px;color:var(--muted)}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}
.nav{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:14px}
.tiles-palavras{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.tiles-frases{grid-template-columns:1fr}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:calc(26px*var(--k));font-family:var(--lf);font-weight:var(--lw);line-height:var(--lh)}
.tile.on{border-color:var(--acc);background:var(--accbg)}

.ptab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#ptab{max-width:960px;margin:0 auto;padding:0 16px 40px}

.kpi b{display:block;font-size:26px}.kpi span{color:var(--muted);font-size:13px}

.tbl th{background:#F6EFE0}
.note{color:var(--muted);font-size:14px}
.legend{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.m{display:inline-block;width:14px;height:14px;border-radius:4px}

.mi small{font-weight:400;font-size:11px;margin-left:4px;color:#555}

.sbtn.on{border-color:var(--acc);background:var(--accbg)}

.fase small{font-family:var(--lf);font-weight:400}

.errs{margin:4px 0 8px;padding-left:20px}.errs li{margin:4px 0}

.rrow{display:grid;grid-template-columns:minmax(80px,1.2fr) minmax(90px,1fr) 110px 44px 44px 44px;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:4px 0}
.rtxt{font-size:20px;font-weight:700}
.rrow code{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.st{font-size:13px}
.rb{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px}
.rb.recon{background:var(--bad);color:#fff;border-color:var(--bad)}
.sw{display:block;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:18px}
.sw input{transform:scale(1.4);margin-right:10px}

/* ---------- áudio ---------- */
let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('lecomigo-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function idbOp(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('rec',mode);const rq=fn(tx.objectStore('rec'));tx.oncomplete=()=>res(rq?rq.result:undefined);tx.onerror=()=>rej(tx.error);});}
const idbGet=id=>idbOp('readonly',s=>s.get(id)).catch(()=>null);
const idbPut=(id,b)=>idbOp('readwrite',s=>s.put(b,id));
const idbDel=id=>idbOp('readwrite',s=>s.delete(id));
const idbKeys=()=>idbOp('readonly',s=>s.getAllKeys()).catch(()=>[]);
const fileCache={};
async function findFile(id){if(!id)return null;if(id in fileCache)return fileCache[id];
 for(const ext of ['mp3','m4a','wav','webm','ogg']){try{const r=await fetch(CFG.AUDIO_DIR+id+'.'+ext,{method:'HEAD'});if(r.ok)return fileCache[id]=CFG.AUDIO_DIR+id+'.'+ext;}catch(e){}}
 return fileCache[id]=null;}
let ptVoice=null;
function loadVoices(){const vs=speechSynthesis.getVoices();ptVoice=vs.find(v=>v.lang==='pt-PT')||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('pt'))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(t){return new Promise(res=>{if(!t||!('speechSynthesis' in window))return res();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-PT';if(ptVoice)u.voice=ptVoice;u.rate=.8;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,4500);});}
let curAudio=null;
function stopAudio(){if(curAudio){curAudio.pause();curAudio=null;}if('speechSynthesis' in window)speechSynthesis.cancel();}
async function play(id,fallback){stopAudio();if(!id)return speak(fallback);let url=null;const b=await idbGet(id);
 if(b)url=URL.createObjectURL(b);else url=await findFile(id);
 if(!url)return speak(fallback);
 return new Promise(res=>{const a=new Audio(url);curAudio=a;a.onended=res;a.onerror=()=>speak(fallback).then(res);a.play().catch(()=>speak(fallback).then(res));});}

/* ---------- utilidades ---------- */
const main=document.getElementById('main'),ovl=document.getElementById('ovl');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function htmlLetters(s){return [...s].map(ch=>ch===' '?' ':`<span class="${isV(ch)?'cv':'cc'}">${ch}</span>`).join('');}
function htmlSyl(sy){return sy.map((s,i)=>`<span class="s${i%2}">${s}</span>`).join('');}
function display(it){if(it.cat==='letras'||it.cat==='silabas')return htmlLetters(it.txt);if(it.cat==='palavras')return htmlSyl(it.parts);return it.words.map(htmlSyl).join(' ')+'.';}
function itemStats(id){let n=0,ok=0;for(const a of DB.attempts)if(a.item===id){n++;if(a.ok)ok++;}return{n,ok};}
const phOf=a=>{const it=BYID[a.item];return it?it.ph:1;};
function levelAcc(c){const r=DB.attempts.filter(a=>a.cat===c&&phOf(a)===phase).slice(-20);return r.length?r.filter(a=>a.ok).length/r.length:null;}
function wpick(w){let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return w.length-1;}
function pickItems(cat,k){const pool=poolOf(cat);const w=pool.map(it=>{const s=itemStats(it.id);return 1+(s.n-s.ok)*2+Math.max(0,3-s.n);});const out=[];let last=null;
 for(let i=0;i<k;i++){let idx,t=0;do{idx=wpick(w);t++;}while(pool[idx]===last&&t<12);out.push(pool[idx]);last=pool[idx];}return out;}
function nOptions(cat){const r=DB.attempts.filter(a=>a.cat===cat&&a.mode==='escolher'&&phOf(a)===phase).slice(-20);if(r.length<8)return 2;const acc=r.filter(a=>a.ok).length/r.length;return Math.min(poolOf(cat).length+prevPool(cat).length,acc>=.9?4:acc>=.75?3:2);}
function sim(a,b){if(a.cat==='letras')return isV(a.txt)===isV(b.txt)?1:0;let s=0;const A=a.txt.toLowerCase(),B=b.txt.toLowerCase();for(let i=0;i<Math.min(A.length,B.length);i++)if(A[i]===B[i])s++;return s;}
function distractors(it,k){const ok=x=>x.id!==it.id&&aid(x)!==aid(it);let c=shuffle(poolOf(it.cat).filter(ok)),p=shuffle(prevPool(it.cat).filter(ok));
 if(k===1){c.sort((a,b)=>sim(it,a)-sim(it,b));return c.length?c.slice(0,1):p.slice(0,1);}
 const out=[];if(k>=3&&p.length){const near=[...c,...p].sort((a,b)=>sim(it,b)-sim(it,a))[0];out.push(near);if(!p.includes(near))out.push(p[0]);}
 for(const x of [...c,...p.slice(0,3)])if(out.length<k&&!out.includes(x))out.push(x);
 for(const x of p)if(out.length<k&&!out.includes(x))out.push(x);return shuffle(out).slice(0,k);}
function wordAudioId(w){const l=w.toLowerCase();const p=ALLPAL.find(x=>x.txt===l);if(p)return p.id;const e=EXTRA.find(x=>x.txt.toLowerCase()===l);return e?e.id:'';}
function partAudio(cat,t){if(cat==='silabas')return['letra-'+t,t];
 if(cat==='palavras'){const s=ALLSYL.find(x=>x.txt===t);if(s)return[s.id,t];if(t.length===1&&isV(t))return['letra-'+t,t];const w=ALLPAL.find(x=>x.txt===t);return[w?w.id:'',t];}
 return[wordAudioId(t),t.toLowerCase()];}
function playPart(cat,t){const[id,s]=partAudio(cat,t);return play(id,s);}
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDur=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

 main.innerHTML=`<div class="letras-fase">${[...P.letters].map(ch=>htmlLetters(ch)).join('')}</div><div class="cards">${CATS.map(c=>{const acc=levelAcc(c);

  <div class="bar"><span style="width:${acc==null?0:Math.round(acc*100)}%"></span></div><div class="bar-l">${acc==null?'Ainda não praticou':Math.round(acc*100)+'% certo à primeira'}</div>
  <div class="modes">${c==='letras'?`<div class="caixa">${Object.keys(CAIXAN).map(k=>`<button class="cx ${PREF.caixa===k?'on':''}" onclick="setCaixa('${k}')">${k==='min'?'a':k==='mai'?'A':'A a'}<small>${CAIXAN[k]}</small></button>`).join('')}</div>`:''}<button class="mode m-ver" onclick="renderVer('${c}',0)">👀 Ver e ouvir</button><button class="mode m-esc" onclick="startRound('${c}','escolher')">👂 Ouvir e escolher</button>${c==='letras'?'':`<button class="mode m-con" onclick="startRound('${c}','construir')">🧩 Ouvir e construir</button>`}</div></div>`;}).join('')}</div>`;}

function renderVer(cat,idx){stopAudio();R=null;const list=cat==='letras'&&PREF.caixa==='mai'?MAI:ITEMS[cat];idx=(idx+list.length)%list.length;const it=list[idx];
 let parts='';
 if(cat!=='letras'){const sep=cat==='frases'?'':'<span class="plus">+</span>';
  parts=`<div class="parts">${it.parts.map(p=>`<button class="part" onclick="playPart('${cat}','${esc(p)}')">${cat==='silabas'?htmlLetters(p):p}</button>`).join(sep)}${cat==='frases'?'<span class="ponto" style="font-size:calc(28px*var(--k))">.</span>':`<span class="plus">=</span><button class="part whole" onclick="playIdx('${cat}',${idx})">${display(it)}</button>`}</div>`;}
 main.innerHTML=topBar(cat,'ver')+`<div class="focus">${it.img?`<div class="pic">${IMG[it.img]}</div>`:''}
 <button class="big big-${cat}" onclick="playIdx('${cat}',${idx})">${display(it)}</button>
 ${cat==='letras'?`<div class="upper">${htmlLetters(it.txt.toUpperCase())} ${htmlLetters(it.txt.toLowerCase())}</div>`:''}${parts}
 <div class="row"><button class="nav" onclick="renderVer('${cat}',${idx-1})">◀</button><button class="listen" onclick="playIdx('${cat}',${idx})">🔊</button><button class="nav" onclick="renderVer('${cat}',${idx+1})">▶</button></div></div>
 <div class="tiles tiles-${cat}">${list.map((x,i)=>`<button class="tile ${i===idx?'on':''}" onclick="renderVer('${cat}',${i})">${display(x)}</button>`).join('')}</div>`;
 playIdx(cat,idx);}
function playIdx(cat,i){const it=(cat==='letras'&&PREF.caixa==='mai'?MAI:ITEMS[cat])[i];return play(aid(it),it.say);}

/* ---------- rondas ---------- */
const cur=()=>R.items[R.i];
function playItem(){const it=cur();return play(aid(it),it.say);}
function praise(){if(Math.random()>0.3)return new Promise(r=>setTimeout(r,250));const id=Math.random()<.5?'msg-muito-bem':'msg-boa';return play(id,MSG[id]);}
function showPic(it){const p=document.getElementById('pic');if(p&&it.img)p.innerHTML=IMG[it.img];}
function startRound(cat,mode){stopAudio();R={cat,mode,items:pickItems(cat,CFG.RONDA),i:0,ok:0,t0:Date.now()};renderQ(true);}
function renderQ(first){const it=cur();R.q={first:true,t:Date.now(),wrong:null,done:false,n:null,tries:[]};
 const dots=R.items.map((_,k)=>`<span class="dot ${k<R.i?'done':k===R.i?'now':''}"></span>`).join('');
 let body;
 if(R.mode==='escolher'){const n=nOptions(R.cat);R.q.n=n;const opts=shuffle([it,...distractors(it,n-1)]);
  body=`<div class="opts opts-${R.cat}">${opts.map(o=>`<button class="opt" onclick="choose(this,'${o.id}')">${display(o)}</button>`).join('')}</div>`;}
 else{buildConstruct(it);body=constructHTML();}
 main.innerHTML=topBar(R.cat,R.mode)+`<div class="dots">${dots}</div><div class="ask"><button class="listen" onclick="playItem()">🔊</button></div><div id="pic" class="pic small"></div>`+body;
 if(first){const m=R.mode==='escolher'?'msg-ouve-escolhe':'msg-ouve-constroi';play(m,MSG[m]).then(()=>{if(R&&R.q&&!R.q.done)playItem();});}
 else playItem();}
function choose(btn,id){const q=R.q;if(q.done||btn.disabled)return;const it=cur();
 if(id===it.id){q.done=true;btn.classList.add('right');showPic(it);praise().then(()=>setTimeout(()=>{if(R&&R.q===q)nextQ();},350));}
 else{btn.classList.add('wrong');btn.disabled=true;{const w=poolOf(R.cat).find(x=>x.id===id);const wt=w?w.txt:id;q.tries.push(wt);if(q.first){q.first=false;q.wrong=wt;}}
  play('msg-tenta-outra-vez',MSG['msg-tenta-outra-vez']).then(()=>{if(!q.done)playItem();});}}
function nextQ(){if(!R)return;const it=cur(),q=R.q;
 DB.attempts.push({id:uid(),t:Date.now(),cat:R.cat,mode:R.mode,item:it.id,txt:it.txt,ph:phase,ok:q.first,ms:Date.now()-q.t,n:q.n,wrong:q.wrong,tries:q.tries});if(q.first)R.ok++;save();fbSync();
 R.i++;if(R.i>=R.items.length)finish();else renderQ(false);}
function buildConstruct(it){const parts=it.parts,low=parts.map(p=>p.toLowerCase());
 const pool=R.cat==='silabas'?LETPOOL:R.cat==='palavras'?SYLPOOL:WORDPOOL;
 const extra=shuffle(pool.filter(p=>!low.includes(p.toLowerCase()))).slice(0,R.cat==='frases'?1:2);
 R.q.pieces=shuffle([...parts,...extra]).map(t=>({t,used:false}));R.q.slots=parts.map(()=>null);R.q.bad=null;R.q.good=false;R.q.locked=false;}
function pieceHTML(t){return R.cat==='silabas'?htmlLetters(t):t;}
function constructHTML(){const q=R.q;
 return`<div id="con"><div class="slots slots-${R.cat}">${q.slots.map((pi,s)=>`<button class="slot ${pi==null?'empty':''} ${q.bad&&q.bad.includes(s)?'wrongslot':''} ${q.good?'right':''}" onclick="unslot(${s})">${pi==null?'':pieceHTML(q.pieces[pi].t)}</button>`).join('')}${R.cat==='frases'?'<span class="ponto">.</span>':''}</div>
 <div class="pieces pieces-${R.cat}">${q.pieces.map((p,i)=>`<button class="piece ${p.used?'used':''}" ${p.used?'disabled':''} onclick="takePiece(${i})">${pieceHTML(p.t)}</button>`).join('')}</div></div>`;}
function rerenderCon(){const c=document.getElementById('con');if(c)c.outerHTML=constructHTML();}
function takePiece(i){const q=R.q;if(q.done||q.locked)return;const p=q.pieces[i];if(p.used)return;const s=q.slots.indexOf(null);if(s<0)return;
 q.slots[s]=i;p.used=true;q.bad=null;rerenderCon();
 if(!q.slots.includes(null)){q.locked=true;playPart(R.cat,p.t).then(()=>new Promise(r=>setTimeout(r,500))).then(()=>{if(R&&R.q===q){q.locked=false;checkCon();}});}
 else playPart(R.cat,p.t);}
function unslot(s){const q=R.q;if(q.done||q.locked)return;const pi=q.slots[s];if(pi==null)return;q.pieces[pi].used=false;q.slots[s]=null;q.bad=null;rerenderCon();}
function checkCon(){const q=R.q,it=cur();const bad=[];q.slots.forEach((pi,s)=>{if(q.pieces[pi].t!==it.parts[s])bad.push(s);});
 if(!bad.length){q.done=true;q.good=true;rerenderCon();showPic(it);playItem().then(praise).then(()=>setTimeout(()=>{if(R&&R.q===q)nextQ();},350));return;}
 {const wt=q.slots.map(pi=>q.pieces[pi].t).join(R.cat==='frases'?' ':'');q.tries.push(wt);if(q.first){q.first=false;q.wrong=wt;}}
 q.bad=bad;q.locked=true;rerenderCon();
 play('msg-tenta-outra-vez',MSG['msg-tenta-outra-vez']).then(()=>{bad.forEach(s=>{q.pieces[q.slots[s]].used=false;q.slots[s]=null;});q.bad=null;q.locked=false;rerenderCon();playItem();});}
function finish(){const dur=Date.now()-R.t0;DB.sessions.push({id:uid(),t:Date.now(),ph:phase,cat:R.cat,mode:R.mode,n:R.items.length,ok:R.ok,dur});save();fbSync();
 const st=R.ok>=7?3:R.ok>=5?2:1;
 main.innerHTML=topBar(R.cat,R.mode)+`<div class="fim"><div class="stars">${'⭐'.repeat(st)}${'<span class="off">⭐</span>'.repeat(3-st)}</div><p class="fim-t">${R.ok} de ${R.items.length} à primeira!</p>
 <div class="row"><button class="bigbtn" onclick="startRound('${R.cat}','${R.mode}')">🔁 Outra vez</button><button class="bigbtn alt" onclick="renderHome()">🏠 Início</button></div></div>`;}

/* ---------- área do professor ---------- */
let pinOk=false,ptabCur='rel';
function openTeacher(){if(!pinOk){const v=prompt('PIN do professor:');if(v===null)return;if(v!==CFG.PIN){alert('PIN errado.');return;}pinOk=true;}openPanel('rel');}
let REP={aluno:ALUNO,src:'fb'};
function repHead(){return `<div class="repbar noprint"><label>Aluno <input id="repAluno" value="${REP.aluno}" size="6" onchange="REP.aluno=this.value.trim()||'01';openPanel('rel')"></label><button class="sbtn ${REP.src==='fb'?'on':''}" onclick="REP.src='fb';openPanel('rel')">☁️ Firebase</button><button class="sbtn ${REP.src==='local'?'on':''}" onclick="REP.src='local';openPanel('rel')">💻 Este aparelho</button></div>`;}
function setFase(n,op){const al=REP.aluno;if(!confirm((op?'Abrir':'Fechar')+' a Fase '+n+' para o aluno '+al+'?'))return;
 if(al===ALUNO){OPEN[n]=op;saveOpen();}REP.fases=Object.assign({},REP.fases||OPEN,{[n]:op});
 if(window.FB&&FB.ready)FB.setFase(al,n,op).then(()=>openPanel('rel'),e=>{alert('Não foi possível gravar no Firebase ('+(e&&e.code||e)+').');openPanel('rel');});
 else{alert('Sem ligação ao Firebase: a alteração só vale neste aparelho.');openPanel('rel');}}
function drawReport(el,data,srcTxt){const keep=DB;DB=data;try{reportCore(el,srcTxt);}finally{DB=keep;}el.insertAdjacentHTML('afterbegin',repHead());}
function renderReport(el){
 if(REP.src==='local'){drawReport(el,REP.aluno===ALUNO?DB:{attempts:[],sessions:[]},'dados deste aparelho');return;}
 el.innerHTML=repHead()+'<p class="note">A carregar do Firebase…</p>';
 const go=()=>FB.load(REP.aluno).then(async d=>{try{REP.fases=Object.assign({1:true},await FB.getFases(REP.aluno));}catch(e){}drawReport(el,d,'dados do Firebase (todos os aparelhos)');}).catch(e=>{el.innerHTML=repHead()+'<p class="note">Não foi possível ler o Firebase ('+(e&&e.code||e)+'). Mostro os dados deste aparelho.</p>';const d=document.createElement('div');el.appendChild(d);drawReport(d,DB,'dados deste aparelho');});
 let n=0;(function wait(){if(window.FB&&FB.ready)return go();if(++n>40){el.innerHTML=repHead()+'<p class="note">Sem ligação ao Firebase. Mostro os dados deste aparelho.</p>';const d=document.createElement('div');el.appendChild(d);drawReport(d,DB,'dados deste aparelho');return;}setTimeout(wait,250);})();}
function openPanel(tab){stopAudio();ptabCur=tab;ovl.hidden=false;
 ovl.innerHTML=`<div class="ph noprint"><div class="ptabs">${[['rel','📊 Relatório'],['grav','🎙️ Gravações']].map(([k,l])=>`<button class="ptab ${k===tab?'on':''}" onclick="openPanel('${k}')">${l}</button>`).join('')}</div><button class="home" onclick="closePanel()">✕ Fechar</button></div><div id="ptab"></div>`;
 const el=document.getElementById('ptab');if(tab==='rel')renderReport(el);else renderStudio(el);}
function closePanel(){REP.fases=null;if(mediaRec&&mediaRec.state==='recording')mediaRec.stop();ovl.hidden=true;ovl.innerHTML='';renderHome();}

function cell(c,m,f){const a=DB.attempts.filter(x=>x.cat===c&&x.mode===m&&(!f||f(x)));if(!a.length)return'—';return Math.round(100*a.filter(x=>x.ok).length/a.length)+'% <small>('+a.filter(x=>x.ok).length+' de '+a.length+')</small>';}
function chartSVG(){const A=DB.attempts;const days=[...new Set(A.map(a=>dayKey(a.t)))].sort();if(!days.length)return'<p class="note">Ainda sem dados.</p>';
 const W=640,H=240,L=44,Rr=14,T=12,B=36,col={letras:'#2563B8',silabas:'#D9473A',palavras:'#2E9E5B',frases:'#8E44AD'};
 const x=i=>days.length===1?L+(W-L-Rr)/2:L+i*(W-L-Rr)/(days.length-1),y=v=>T+(1-v)*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:12px">`;
 [0,.5,1].forEach(v=>{s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#EEE6D3"/><text x="${L-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#888">${v*100}%</text>`;});
 const step=Math.ceil(days.length/8);days.forEach((d,i)=>{if(i%step===0)s+=`<text x="${x(i)}" y="${H-12}" font-size="11" text-anchor="middle" fill="#888">${d.slice(8)}/${d.slice(5,7)}</text>`;});
 CATS.forEach(c=>{const pts=days.map((d,i)=>{const a=A.filter(z=>z.cat===c&&dayKey(z.t)===d);return a.length?[x(i),y(a.filter(z=>z.ok).length/a.length)]:null;}).filter(Boolean);
  if(!pts.length)return;s+=`<polyline fill="none" stroke="${col[c]}" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col[c]}"/>`).join('');});
 s+='</svg>';s+=`<div class="legend">${CATS.map(c=>`<span class="m" style="background:${col[c]}"></span>${CATN[c]}`).join(' ')}</div>`;return s;}
const ALLIT=ALLPH.flatMap(p=>[...p.items.letras,...p.mai,...p.items.silabas,...p.items.palavras,...p.items.frases]);
const BYID=Object.fromEntries(ALLIT.map(x=>[x.id,x]));
const LVN={letras:'Letras',silabas:'Sílabas',palavras:'Palavras',frases:'Frases'};
const fmtD=t=>new Date(t).toLocaleDateString('pt-PT'),fmtH=t=>new Date(t).toLocaleTimeString('pt-PT');
const itTxt=a=>{const it=BYID[a.item];return it?it.txt:(a.txt||a.item);};
const nivel=a=>'Fase '+phOf(a)+' · '+LVN[a.cat]+((a.item||'').startsWith('maiuscula-')?' (maiúscula)':'');
function wrongList(a){return a.tries&&a.tries.length?a.tries:(a.wrong?[a.wrong]:[]);}
let LASTREP=null;
function reportCore(el,srcTxt){LASTREP={data:DB,aluno:REP.aluno};const A=DB.attempts,S=DB.sessions;
 const days=new Set(A.map(a=>dayKey(a.t)));const tot=A.reduce((s,x)=>s+Math.min(x.ms||0,60000),0);
 const last=A.length?A[A.length-1].t:null;
 const kpi=(l,v)=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`;
 let h=`<h2 style="margin:6px 0">Relatório</h2><p class="note">Gerado a ${fmtD(Date.now())} · aluno ${REP.aluno} · ${srcTxt}</p>`;
 h+=`<div class="kpis">${kpi('Dias de prática',days.size)}${kpi('Tempo a praticar',fmtDur(tot))}${kpi('Respostas dadas',A.length)}${kpi('Última prática',last?fmtD(last)+' '+new Date(last).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'—')}</div>`;
 for(const P of ALLPH){const AP=A.filter(x=>phOf(x)===P.n);
 h+=`<h2 class="phh">Fase ${P.n} <small>(${P.letters.split('').join(' ')})</small></h2>`;
 const blocks=[['letras','🔤 Letras',[...P.items.letras,...P.mai]],['silabas','🧩 Sílabas',P.items.silabas],['palavras','📖 Palavras',P.items.palavras],['frases','💬 Frases',P.items.frases]];
 for(const [cat,title,list] of blocks){const aa=AP.filter(x=>x.cat===cat);
  const pct=aa.length?Math.round(100*aa.filter(x=>x.ok).length/aa.length)+'% certo à 1.ª tentativa ('+aa.length+' respostas)':'ainda não praticou';
  const sabe=[],erra=[],pouco=[],nunca=[];
  for(const it of list){const xs=aa.filter(x=>x.item===it.id);if(!xs.length){if(!(cat==='letras'&&it.up))nunca.push(it.txt);continue;}
   const ok=xs.filter(x=>x.ok).length;
   if(xs.length>=3&&xs.slice(-3).every(x=>x.ok)){sabe.push(it.txt);continue;}
   if(ok<xs.length){const conf={};xs.forEach(x=>wrongList(x).forEach(w=>{const k=(x.mode==='construir'?'construiu':'escolheu')+' «'+w+'»';conf[k]=(conf[k]||0)+1;}));
     erra.push({it,err:xs.length-ok,n:xs.length,conf:Object.entries(conf).sort((p,q)=>q[1]-p[1])});}
   else if(xs.length>=3)sabe.push(it.txt);else pouco.push(it.txt);}
  erra.sort((p,q)=>q.err-p.err);
  h+=`<div class="blk"><div class="blk-h"><h3>${title}</h3><span class="note">${pct}</span></div>`;
  if(aa.length){
   h+=`<p><b>✅ Já sabe:</b> ${sabe.length?sabe.map(t=>`<span class="chip ok">${t}</span>`).join(' '):'<span class="note">ainda nenhum (conta quando acerta 3 vezes seguidas)</span>'}</p>`;
   if(pouco.length)h+=`<p><b>🟡 Acertou, mas praticou pouco:</b> ${pouco.map(t=>`<span class="chip">${t}</span>`).join(' ')}</p>`;
   h+=`<p><b>⚠️ Ainda erra:</b>${erra.length?'':' <span class="note">nada</span>'}</p>`;
   if(erra.length)h+=`<ul class="errs">${erra.map(e=>`<li>Ouviu <b>«${e.it.txt}»</b>${e.it.up?' <small>(maiúscula)</small>':''} — errou ${e.err} de ${e.n} vezes: ${e.conf.map(([k,v])=>k+(v>1?' ('+v+'×)':'')).join(', ')}</li>`).join('')}</ul>`;
   if(nunca.length)h+=`<p class="note">⚪ Ainda não praticou: ${nunca.join(', ')}</p>`;}
  h+=`</div>`;}}
 h+=`<h3>Evolução por dia (% certo à primeira tentativa)</h3>`+chartSVG();
 h+=`<h3>Últimas sessões</h3>`+(S.length?`<table class="tbl"><tr><th>Dia</th><th>Hora</th><th>Nível</th><th>Modo</th><th>Certas à 1.ª</th><th>Duração</th></tr>${S.slice(-15).reverse().map(x=>`<tr><td>${fmtD(x.t-x.dur)}</td><td>${new Date(x.t-x.dur).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</td><td>Fase ${x.ph||1} · ${LVN[x.cat]}</td><td>${MODEN[x.mode]}</td><td>${x.ok} de ${x.n}</td><td>${Math.max(1,Math.round(x.dur/60000))} min</td></tr>`).join('')}</table>`:'<p class="note">Ainda nenhuma sessão completa (uma sessão conta quando chega ao fim das 8 perguntas).</p>');
 h+=`<div class="row noprint" style="justify-content:flex-start;margin-top:20px"><button class="sbtn" onclick="window.print()">🖨 Imprimir / PDF</button><button class="sbtn" onclick="exportExcel()">⬇ Excel</button><button class="sbtn danger" onclick="resetData()">🗑 Apagar dados</button></div>`;
 el.innerHTML=h;}
async function exportExcel(){if(!LASTREP)return;try{if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');}catch(e){alert('Não foi possível preparar o Excel (sem internet?).');return;}
 const {data,aluno}=LASTREP;const A=data.attempts,S=data.sessions;
 const res=a=>a.ok?'Certo à 1.ª':('Errou'+(a.tries&&a.tries.length?' '+a.tries.length+'×, depois acertou':' à 1.ª'));
 const rows=A.map(a=>{const w=wrongList(a);return {'Dia':fmtD(a.t),'Hora':fmtH(a.t),'Nível':nivel(a),'Modo':MODEN[a.mode]||a.mode,'Ouviu':itTxt(a),'Respondeu':[...w,itTxt(a)].join(' → '),'Resultado':res(a),'Tempo (s)':Math.round((a.ms||0)/1000)};});
 const ses=S.map(x=>({'Dia':fmtD(x.t-x.dur),'Início':fmtH(x.t-x.dur),'Fim':fmtH(x.t),'Nível':'Fase '+(x.ph||1)+' · '+LVN[x.cat],'Modo':MODEN[x.mode]||x.mode,'Certas à 1.ª':x.ok+' de '+x.n,'Duração (min)':Math.round(x.dur/6000)/10}));
 const sum=[];for(const P of ALLPH)for(const cat of CATS){const aa=A.filter(x=>x.cat===cat&&phOf(x)===P.n);if(!aa.length){if(P.n>1)continue;sum.push({'Nível':'Fase '+P.n+' · '+LVN[cat],'Respostas':0,'% certo à 1.ª':'','Item':'(ainda não praticou)','Vezes':'','Erros':'','Confusões':''});continue;}
  const items=[...new Set(aa.map(x=>x.item))];
  for(const id of items){const xs=aa.filter(x=>x.item===id);const ok=xs.filter(x=>x.ok).length;const conf={};xs.forEach(x=>wrongList(x).forEach(w=>conf[w]=(conf[w]||0)+1));
   sum.push({'Nível':nivel(xs[0]),'Respostas':aa.length,'% certo à 1.ª':Math.round(100*aa.filter(x=>x.ok).length/aa.length)+'%','Item':itTxt(xs[0]),'Vezes':xs.length,'Erros':xs.length-ok,'Confusões':Object.entries(conf).map(([k,v])=>k+(v>1?' ('+v+'×)':'')).join(', ')});}}
 const wb=XLSX.utils.book_new();
 const add=(arr,name,w)=>{const ws=XLSX.utils.json_to_sheet(arr.length?arr:[{'':'Sem dados'}]);ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name);};
 add(rows,'Respostas',[11,10,20,18,22,36,26,9]);add(ses,'Sessões',[11,10,10,10,18,12,13]);add(sum,'Resumo',[20,10,12,22,7,6,40]);
 XLSX.writeFile(wb,'lecomigo-aluno'+aluno+'-'+dayKey(Date.now())+'.xlsx');}
function exportData(){download(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),'lecomigo-progresso-'+dayKey(Date.now())+'.json');}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.attempts))throw 0;if(confirm('Substituir os dados deste aparelho pelos do ficheiro?')){DB=d;DB.unlocked=DB.unlocked||{1:true};save();openPanel('rel');}}catch(e){alert('Ficheiro inválido.');}};r.readAsText(f);}
function resetData(){const al=REP.aluno;if(!confirm('Apagar todo o progresso do aluno '+al+'?\n(neste aparelho e no Firebase)')||!confirm('Tens a certeza? Não dá para desfazer.'))return;
 let local=0;if(al===ALUNO){local=DB.attempts.length;DB={attempts:[],sessions:[],unlocked:DB.unlocked};save();}
 const done=()=>openPanel('rel');
 if(!(window.FB&&FB.ready)){alert('Apagado neste aparelho ('+local+' respostas). Sem ligação ao Firebase: lá não foi apagado.');return done();}
 FB.wipe(al).then(n=>{alert('Apagados '+n+' registos no Firebase'+(al===ALUNO?' e '+local+' respostas neste aparelho':'')+'.');done();})
 .catch(e=>{FB.reset(al).then(()=>{alert('O Firebase não deixou apagar ('+(e&&e.code||e)+'). Os dados ficaram escondidos do relatório. Para apagar a sério, atualiza as regras do Firebase.');done();},()=>{alert('Não foi possível apagar no Firebase.');done();});});}

/* ---------- gravações ---------- */
const GROUPS=[...ALLPH.flatMap(p=>[['Fase '+p.n+' · Letras (som)',p.items.letras],['Fase '+p.n+' · Sílabas',p.items.silabas],['Fase '+p.n+' · Palavras',p.items.palavras],['Fase '+p.n+' · Frases',p.items.frases],['Fase '+p.n+' · Palavras das frases',EXTRA.filter(x=>x.ph===p.n)]]),['Mensagens',MSGS]];
const ALLIDS=new Set(GROUPS.flatMap(g=>g[1].map(x=>x.id)));
let mediaRec=null,recId=null;
const extOf=t=>/mp4|m4a|aac/.test(t)?'m4a':/mpeg|mp3/.test(t)?'mp3':/ogg/.test(t)?'ogg':/wav/.test(t)?'wav':'webm';
async function renderStudio(el){el=el||document.getElementById('ptab');if(!el)return;const keys=new Set(await idbKeys());
 const total=ALLIDS.size,have=[...ALLIDS].filter(id=>keys.has(id)).length;
 el.innerHTML=`<p class="note">Toca em ● para gravar e em ■ para parar; a gravação toca logo a seguir. Fica guardada neste aparelho e a app passa a usá-la. Para a levar para outros aparelhos, descarrega o zip e põe a pasta <b>audio</b> no repositório, ao lado do index.html. Também podes importar ficheiros gravados no telemóvel, desde que tenham o nome indicado.</p>
 <div class="row" style="justify-content:flex-start"><b>${have} de ${total} gravados neste aparelho</b><button class="sbtn" onclick="zipAll()">⬇ Descarregar zip</button><label class="sbtn">⬆ Importar ficheiros<input type="file" accept="audio/*" multiple hidden onchange="importAudio(this.files)"></label></div>`+
 GROUPS.map(([g,list])=>`<h3>${g}</h3>`+list.map(x=>{const rec=recId===x.id,has=keys.has(x.id);
  return`<div class="rrow"><span class="rtxt">${x.txt}</span><code>${x.id}</code><span class="st" id="st-${x.id}">${has?'✅ gravado':'…'}</span><button class="rb ${rec?'recon':''}" onclick="toggleRec('${x.id}')">${rec?'■':'●'}</button><button class="rb" onclick="play('${x.id}','${esc(x.say||x.txt)}')">▶</button>${has?`<button class="rb" onclick="delRec('${x.id}')">🗑</button>`:'<span></span>'}</div>`;}).join('')).join('');
 for(const id of ALLIDS)if(!keys.has(id))findFile(id).then(u=>{const s=document.getElementById('st-'+id);if(s)s.textContent=u?'🌐 no site':'⚪ em falta';});}
async function toggleRec(id){if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return;}
 if(!navigator.mediaDevices||!window.MediaRecorder){alert('Este navegador não permite gravar. Experimenta o Chrome ou o Safari atualizados.');return;}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){alert('Não foi possível usar o microfone. Abre a app pelo endereço https (GitHub Pages) e autoriza o microfone.');return;}
 stopAudio();const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].find(m=>MediaRecorder.isTypeSupported(m));
 const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];mediaRec=mr;recId=id;
 mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});await idbPut(id,blob);mediaRec=null;recId=null;if(!ovl.hidden&&ptabCur==='grav')await renderStudio();play(id,'');};
 mr.start();renderStudio();}
async function delRec(id){if(!confirm('Apagar esta gravação?'))return;await idbDel(id);renderStudio();}
async function importAudio(files){let n=0,bad=[];for(const f of files){const stem=f.name.replace(/\.[^.]+$/,'');if(ALLIDS.has(stem)){await idbPut(stem,f);n++;}else bad.push(f.name);}
 alert(n+' ficheiro(s) importado(s).'+(bad.length?'\nNomes não reconhecidos: '+bad.join(', '):''));renderStudio();}
async function zipAll(){try{if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');}catch(e){alert('Não foi possível carregar o compressor (sem internet?).');return;}
 const zip=new JSZip(),f=zip.folder('audio');let n=0;for(const id of ALLIDS){const b=await idbGet(id);if(b){f.file(id+'.'+extOf(b.type||''),b);n++;}}
 if(!n){alert('Ainda não há gravações neste aparelho.');return;}download(await zip.generateAsync({type:'blob'}),'audio-fase1.zip');}

renderHome();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {initializeFirestore,persistentLocalCache,collection,doc,setDoc,getDocs,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={apiKey:"AIzaSyAJdVLPoQnyq-Iu4rgP1HIYnCpArVYOc9Y",authDomain:"leitura-1m.firebaseapp.com",projectId:"leitura-1m",storageBucket:"leitura-1m.firebasestorage.app",messagingSenderId:"126861655472",appId:"1:126861655472:web:c966850e473f3d8650aa75"};
try{
 const app=initializeApp(cfg,'lecomigo');const auth=getAuth(app);
 let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache()});}catch(e){db=initializeFirestore(app,{});}
 const FB={ready:false,
  sync(){const d=DB;if(!d)return;const a0=d.sentA||0,s0=d.sentS||0;
   const put=(c,x)=>{if(!x.id)x.id=uid();setDoc(doc(db,'lecomigo',ALUNO,c,x.id),x).catch(()=>{});};
   d.attempts.slice(a0).forEach(x=>put('tentativas',x));d.sessions.slice(s0).forEach(x=>put('rondas',x));

  async wipe(aluno){let n=0;for(const c of ['tentativas','rondas','marcos']){const snap=await getDocs(collection(db,'lecomigo',aluno,c));for(const d of snap.docs){await deleteDoc(d.ref);if(c!=='marcos')n++;}}return n;},
  setFase(aluno,n,op){const id=uid();return setDoc(doc(db,'lecomigo',aluno,'fases',id),{id,t:Date.now(),fase:n,aberta:op});},

  reset(aluno){const id=uid();return setDoc(doc(db,'lecomigo',aluno,'marcos',id),{id,t:Date.now(),tipo:'apagar'});},
  async load(aluno){const get=async c=>(await getDocs(collection(db,'lecomigo',aluno,c))).docs.map(x=>x.data());
   const marks=await get('marcos');const cut=marks.reduce((m,x)=>Math.max(m,x.t||0),0);
   const clean=arr=>{const seen=new Set();return arr.filter(x=>x.t>cut&&!(x.id&&seen.has(x.id))&&(x.id?seen.add(x.id):1)).sort((a,b)=>a.t-b.t);};
   return {attempts:clean(await get('tentativas')),sessions:clean(await get('rondas'))};}};
 window.FB=FB;
 onAuthStateChanged(auth,u=>{if(u){FB.ready=true;FB.sync();FB.getFases(ALUNO).then(applyFases).catch(()=>{});}});
 signInAnonymously(auth).catch(e=>console.warn('Firebase auth',e));
}catch(e){console.warn('Firebase',e);}
