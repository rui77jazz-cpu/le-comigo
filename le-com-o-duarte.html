<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lê com o Duarte</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #ffe29f 0%, #ffa99f 48%, #ff719a 100%);
    background-attachment: fixed;
    min-height: 100vh; color: #2b2b3a; user-select: none;
  }
  header { text-align: center; padding: 16px; }
  header h1 { margin: 0; font-size: 1.8rem; color: #fff; text-shadow: 2px 2px 0 #e05070; }

  #menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 10px 16px 24px; }
  .cartao {
    width: 150px; border-radius: 22px; padding: 16px 10px; text-align: center; cursor: pointer; border: none;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15); font-family: inherit; font-size: 1rem; font-weight: bold; color: #fff;
  }
  .cartao:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .cartao .emoji { font-size: 2.6rem; display: block; margin-bottom: 6px; }
  .cartao .ganhas { display: block; margin-top: 6px; font-size: 1.1rem; min-height: 1.3rem; }

  .ecra { display: none; padding: 0 14px 40px; max-width: 760px; margin: 0 auto; }
  .barra { display: flex; align-items: center; gap: 10px; padding: 8px 4px; }
  .btn {
    border: none; border-radius: 16px; padding: 12px 16px; font-family: inherit;
    font-size: 1rem; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.18);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
  .btn-voltar { background: #8a7fff; }
  .btn-ouvir { background: #35c76a; flex: 1; font-size: 1.1rem; }
  .btn-silabas { background: #ff8c42; }
  .btn-silabas.ativo { background: #d85a0e; outline: 3px solid #fff; }
  .btn-jali { display: block; width: 100%; margin-top: 18px; background: #ff4f7b; font-size: 1.3rem; padding: 16px; }
  .btn-whats { text-decoration: none; text-align: center; display: block; width: 100%; background: #25d366; font-size: 1.25rem; padding: 16px; margin: 14px 0 12px; }

  .caixa {
    background: #fff; border-radius: 26px; padding: 22px 16px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12); margin-top: 10px;
  }
  .titulo-texto { font-size: 1.5rem; margin: 0 0 12px; text-align: center; }
  #corpoTexto { line-height: 2.2; font-size: 1.5rem; }
  #corpoTexto .linha { margin-bottom: 6px; }

  .palavra { display: inline-block; margin: 1px 2px; padding: 1px 5px; border-radius: 10px; cursor: pointer; transition: background .15s, transform .1s; }
  .palavra.ativa { background: #ffe14d; transform: scale(1.1); }
  .pont { display: inline-block; margin: 0 2px; }
  .silaba { display: inline-block; padding: 0 2px; }
  .silaba + .silaba { border-left: 2px dotted #ff8c42; }
  .silaba.ativa { background: #7fd0ff; border-radius: 8px; }

  /* Perguntas */
  .progresso { text-align: center; color: #fff; font-size: 1.1rem; font-weight: bold; text-shadow: 1px 1px 0 #d85a0e; }
  .tipo { text-align: center; font-size: 1rem; font-weight: bold; color: #8a7fff; margin-bottom: 6px; }
  .pergunta { font-size: 1.45rem; text-align: center; margin: 4px 0 18px; line-height: 1.4; }
  .opcoes { display: flex; flex-direction: column; gap: 12px; }
  .opcoes.vf { flex-direction: row; }
  .opcoes.vf .opcao { flex: 1; font-size: 1.4rem; font-weight: bold; }
  .opcao {
    border: 3px solid #e3e3f0; background: #f7f7ff; border-radius: 18px; padding: 14px;
    font-family: inherit; font-size: 1.25rem; cursor: pointer; color: #2b2b3a; box-shadow: 0 4px 0 #e3e3f0; text-align: center;
  }
  .opcao.certa { background: #c9f7d6; border-color: #35c76a; box-shadow: 0 4px 0 #35c76a; }
  .opcao.errada { background: #ffd6dc; border-color: #ff4f7b; box-shadow: 0 4px 0 #ff4f7b; animation: abanar .35s; }
  .opcao.usada { opacity: .35; pointer-events: none; }
  @keyframes abanar { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  .ordem-lugares { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .lugar {
    min-height: 54px; border: 3px dashed #c9c9e0; border-radius: 16px; padding: 10px 12px;
    font-size: 1.15rem; display: flex; align-items: center; gap: 10px; color: #2b2b3a;
  }
  .lugar .num { background: #8a7fff; color: #fff; border-radius: 50%; width: 32px; height: 32px; flex: 0 0 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .lugar.cheio { border-style: solid; border-color: #35c76a; background: #effcf3; }

  .feedback { text-align: center; font-size: 1.3rem; font-weight: bold; min-height: 1.8rem; margin-top: 14px; }
  .feedback.bom { color: #1e9c4c; }
  .feedback.mau { color: #e03a62; }

  .final { text-align: center; }
  .nota-num { font-size: .95rem !important; color: #6b6b80; margin: 0 0 14px !important; user-select: text; }
  .estrelas { font-size: 3rem; letter-spacing: 6px; min-height: 3.4rem; }
  .final p { font-size: 1.4rem; margin: 8px 0 16px; }

  /* Relatório */
  #zonaRel { text-align: center; padding: 0 16px 30px; }
  .btn-rel { background: #fff; color: #e05070; font-size: 1.05rem; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .rel h2 { font-size: 1.3rem; margin: 18px 0 8px; }
  .rel .sub { color: #6b6b80; font-size: .95rem; margin: 4px 0 12px; }
  .pinbox { width: 100%; font: inherit; font-size: 1.6rem; padding: 12px; border-radius: 14px; border: 3px solid #e3e3f0; text-align: center; letter-spacing: 8px; margin: 10px 0 14px; user-select: text; }
  .rel select { font: inherit; font-size: 1rem; padding: 10px; border-radius: 12px; border: 2px solid #e3e3f0; width: 100%; background: #fff; }
  .resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .resumo div { background: #f7f7ff; border-radius: 14px; padding: 10px 6px; text-align: center; }
  .resumo b { display: block; font-size: 1.6rem; color: #8a7fff; }
  .resumo span { font-size: .85rem; color: #6b6b80; }
  .acoes { display: flex; gap: 10px; margin: 6px 0 4px; }
  .acoes .btn { flex: 1; }
  .btn-pdf { background: #ff4f7b; }
  .btn-xls { background: #1e9c4c; }
  details.leit { border: 2px solid #e3e3f0; border-radius: 14px; padding: 10px 12px; margin: 8px 0; text-align: left; }
  details.leit summary { cursor: pointer; font-size: 1rem; }
  details.leit summary small { color: #6b6b80; }
  .resp { font-size: .95rem; margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed #e3e3f0; }
  .resp.x { color: #c02a52; }
  .resp small { color: #6b6b80; }
  #printArea { display: none; }
  @media print {
    body { background: #fff !important; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; font-family: Arial, sans-serif; color: #000; font-size: 11pt; }
    #printArea h1 { font-size: 16pt; margin: 0 0 4px; }
    #printArea h2 { font-size: 12.5pt; margin: 16px 0 4px; page-break-after: avoid; }
    #printArea table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; page-break-inside: avoid; }
    #printArea th, #printArea td { border: 1px solid #999; padding: 4px 6px; text-align: left; vertical-align: top; font-size: 10pt; }
    #printArea th { background: #eee; }
    #printArea .mut { color: #555; font-size: 9.5pt; }
    #printArea .no { color: #b00020; font-weight: bold; }
    #printArea .ok { color: #0a7a2f; font-weight: bold; }
  }
</style>
</head>
<body>
<header><h1>📚 Lê com o Duarte</h1></header>

<div id="menu"></div>
<div id="zonaRel"><button class="btn btn-rel" onclick="abrirRel()">📊 O que o Duarte fez</button></div>

<!-- RELATÓRIO (professor e família) -->
<div class="ecra" id="relatorio">
  <div class="barra"><button class="btn btn-voltar" onclick="voltar()">⬅ Voltar</button></div>
  <div class="caixa rel">
    <div id="relPin">
      <h2>📊 O que o Duarte fez</h2>
      <p class="sub">Esta parte é para o professor e para a família.</p>
      <input id="pin" class="pinbox" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')entrarRel()">
      <button class="btn btn-pdf" style="width:100%" onclick="entrarRel()">Entrar</button>
    </div>
    <div id="relDados" style="display:none">
      <h2>📊 O que o Duarte fez</h2>
      <select id="fDias" onchange="desenharRel()">
        <option value="7">Últimos 7 dias</option>
        <option value="30" selected>Últimos 30 dias</option>
        <option value="0">Tudo</option>
      </select>
      <div id="relConteudo"><p class="sub">A carregar…</p></div>
      <div class="acoes">
        <button class="btn btn-pdf" onclick="baixarPDF()">📄 PDF</button>
        <button class="btn btn-xls" onclick="baixarExcel()">📊 Excel</button>
      </div>
      <p class="sub">No telemóvel, o PDF abre a janela de imprimir: escolhe «Guardar como PDF» ou partilha.</p>
    </div>
  </div>
</div>
<div id="printArea"></div>

<!-- LEITURA -->
<div class="ecra" id="leitura">
  <div class="barra">
    <button class="btn btn-voltar" onclick="voltar()">⬅</button>
    <button class="btn btn-ouvir" onclick="ouvirTudo()">▶ Ouvir tudo</button>
    <button class="btn btn-silabas" id="btnSil" onclick="alternarSilabas()">Sílabas</button>
  </div>
  <div class="caixa">
    <h2 class="titulo-texto" id="tituloTexto"></h2>
    <div id="corpoTexto"></div>
  </div>
  <button class="btn btn-jali" onclick="comecarPerguntas()">Já li! 👉 Perguntas</button>
</div>

<!-- PERGUNTAS -->
<div class="ecra" id="perguntas">
  <div class="barra">
    <button class="btn btn-voltar" onclick="voltarAoTexto()">⬅ Texto</button>
    <div class="progresso" id="progresso" style="flex:1"></div>
  </div>
  <div class="caixa">
    <div class="tipo" id="tipoPergunta"></div>
    <div class="pergunta" id="textoPergunta"></div>
    <div id="zonaResposta"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<!-- FINAL -->
<div class="ecra" id="final">
  <div class="caixa final">
    <div class="estrelas" id="estrelas"></div>
    <p id="msgFinal"></p>
    <p class="nota-num" id="saveSt"></p>
    <button class="btn btn-voltar" onclick="voltar()">⬅ Escolher outro texto</button>
  </div>
</div>

<script>

// Tipos de pergunta: "escolha" (a 1.ª opção é a certa), "vf" (verdadeiro/falso), "ordem" (frases pela ordem certa)
const textos = [
  {
    titulo: "O Relógio do Avô", cor: "#2ec4a6", emoji: "🕰️",
    frases: [
      "O a·vô Jo·a·quim tem um re·ló·gio gran·de na sa·la.",
      "O pon·tei·ro pe·que·no mar·ca as ho·ras e o pon·tei·ro gran·de mar·ca os mi·nu·tos.",
      "— A·vô, que ho·ras são? — per·gun·ta o Du·ar·te.",
      "— São qua·tro e mei·a. Es·tá na ho·ra do lan·che! — res·pon·de o a·vô.",
      "O Du·ar·te co·me pão com quei·jo e be·be um co·po de lei·te.",
      "Às cin·co em pon·to, vão os dois pas·se·ar o cão."
    ],
    perguntas: [
      { tipo: "escolha", p: "O que marca o ponteiro grande?", o: ["Os minutos", "As horas", "Os dias"] },
      { tipo: "vf", p: "O Duarte lanchou às quatro e meia.", certo: true },
      { tipo: "escolha", p: "O que comeu o Duarte ao lanche?", o: ["Pão com queijo", "Bolachas", "Fruta"] },
      { tipo: "vf", p: "O Duarte bebeu sumo.", certo: false },
      { tipo: "ordem", p: "Põe a história pela ordem certa.", o: ["O Duarte perguntou as horas.", "Lancharam.", "Foram passear o cão."] }
    ]
  },
  {
    titulo: "Uma Década de Anos", cor: "#ff8a5c", emoji: "🎂",
    frases: [
      "A Ri·ta fez dez a·nos e ga·nhou um bo·lo e·nor·me de cho·co·la·te.",
      "— A·go·ra já tens u·ma dé·ca·da! — dis·se a mãe.",
      "— U·ma dé·ca·da são dez a·nos? — per·gun·tou a Ri·ta.",
      "— Sim. E um sé·cu·lo são cem a·nos — ex·pli·cou a mãe.",
      "A bi·sa·vó, que tem qua·se cem a·nos, sor·riu e dis·se:",
      "— Nós vi·ve·mos no sé·cu·lo vin·te e um, que se es·cre·ve as·sim: XXI."
    ],
    perguntas: [
      { tipo: "escolha", p: "Uma década são…", o: ["10 anos", "100 anos", "1 ano"] },
      { tipo: "vf", p: "A Rita fez cem anos.", certo: false },
      { tipo: "escolha", p: "Um século são…", o: ["100 anos", "10 anos", "1000 anos"] },
      { tipo: "vf", p: "A bisavó tem quase cem anos.", certo: true },
      { tipo: "ordem", p: "Põe a história pela ordem certa.", o: ["A Rita fez anos.", "A mãe falou da década.", "A bisavó falou do século XXI."] }
    ]
  },
  {
    titulo: "O Pelourinho da Vila", cor: "#5b8def", emoji: "🏛️",
    frases: [
      "Na pra·ça da vi·la há u·ma co·lu·na de pe·dra mui·to an·ti·ga.",
      "Cha·ma-·se pe·lou·ri·nho.",
      "— Pa·ra que ser·vi·a es·ta co·lu·na? — per·gun·tou o To·más.",
      "— Mos·tra·va que a vi·la ti·nha um fo·ral, com as re·gras da·das pe·lo rei — res·pon·deu a pro·fes·so·ra.",
      "O fo·ral e·ra um do·cu·men·to es·cri·to há mui·tos, mui·tos a·nos.",
      "O To·más ti·rou u·ma fo·to·gra·fi·a ao pe·lou·ri·nho pa·ra mos·trar ao pai."
    ],
    perguntas: [
      { tipo: "escolha", p: "O pelourinho é…", o: ["Uma coluna de pedra", "Uma árvore", "Uma casa"] },
      { tipo: "vf", p: "O foral tinha regras dadas pelo rei.", certo: true },
      { tipo: "escolha", p: "O que era o foral?", o: ["Um documento escrito", "Uma estátua", "Uma igreja"] },
      { tipo: "vf", p: "O Tomás fez um desenho do pelourinho.", certo: false },
      { tipo: "ordem", p: "Põe a história pela ordem certa.", o: ["O Tomás viu o pelourinho.", "Perguntou à professora.", "Tirou uma fotografia."] }
    ]
  },
  {
    titulo: "A Fogaça da Feira", cor: "#e76f51", emoji: "🍞",
    frases: [
      "No di·a 20 de ja·nei·ro, San·ta Ma·ri·a da Fei·ra es·tá em fes·ta.",
      "É o fe·ri·a·do do con·ce·lho, a Fes·ta das Fo·ga·cei·ras.",
      "— Mãe, por·que é que as me·ni·nas vão ves·ti·das de bran·co? — per·gun·tou o Du·ar·te.",
      "— Le·vam a fo·ga·ça à ca·be·ça, pa·ra cum·prir u·ma pro·mes·sa fei·ta a São Se·bas·ti·ão há mui·tos a·nos — ex·pli·cou a mãe.",
      "A fo·ga·ça é um pão do·ce e a·ma·re·li·nho, com qua·tro bi·cos em ci·ma, co·mo as tor·res do cas·te·lo.",
      "No fim do des·fi·le, o Du·ar·te co·meu um bo·ca·di·nho e dis·se:",
      "— Hum, que de·lí·ci·a! Pa·ra o a·no que·ro mais!"
    ],
    perguntas: [
      { tipo: "escolha", p: "Em que dia é a Festa das Fogaceiras?", o: ["20 de janeiro", "25 de abril", "10 de junho"] },
      { tipo: "vf", p: "As meninas vão vestidas de branco.", certo: true },
      { tipo: "escolha", p: "A fogaça tem quatro bicos, como…", o: ["As torres do castelo", "As estrelas", "As flores"] },
      { tipo: "vf", p: "A fogaça é um pão salgado.", certo: false },
      { tipo: "ordem", p: "Põe a história pela ordem certa.", o: ["Há festa na Feira.", "O Duarte perguntou à mãe.", "O Duarte comeu a fogaça."] }
    ]
  }
];

let modoSilabas = false, textoAtual = null, idxTexto = 0, aLer = false;
let qIdx = 0, acertos = 0, errouEsta = false, respondidas = 0;
const tentativas = []; // cada texto feito desde que a app foi aberta
let atual = null;
const melhores = {};

// ---------- Menu ----------
const menu = document.getElementById('menu');
function estrelasDe(pontos, total) {
  if (pontos === total) return 3;
  if (pontos >= total - 2) return 2;
  if (pontos >= 1) return 1;
  return 0;
}
function desenharMenu() {
  menu.innerHTML = '';
  textos.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'cartao';
    b.style.background = t.cor;
    const g = melhores[i] != null ? '⭐'.repeat(melhores[i]) + '☆'.repeat(3 - melhores[i]) : '';
    b.innerHTML = `<span class="emoji">${t.emoji}</span>${t.titulo}<span class="ganhas">${g}</span>`;
    b.onclick = () => abrirTexto(i);
    menu.appendChild(b);
  });
}
desenharMenu();

function mostrar(id) {
  menu.style.display = id === 'menu' ? 'flex' : 'none';
  document.getElementById('zonaRel').style.display = id === 'menu' ? 'block' : 'none';
  ['leitura', 'perguntas', 'final', 'relatorio'].forEach(e => document.getElementById(e).style.display = e === id ? 'block' : 'none');
  window.scrollTo(0, 0);
}

// ---------- Voz (só no texto) ----------
function vozPT() {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === 'pt-PT') || vs.find(v => v.lang && v.lang.startsWith('pt')) || null;
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
function calar() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
function falar(txt, aoAcabar) {
  if (!('speechSynthesis' in window)) { if (aoAcabar) setTimeout(aoAcabar, 500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt.replace(/·/g, '').replace(/[—.!?,]/g, ' ').trim());
  u.lang = 'pt-PT';
  const v = vozPT(); if (v) u.voice = v;
  u.rate = 0.8;
  if (aoAcabar) u.onend = aoAcabar;
  speechSynthesis.speak(u);
}
const temLetras = s => /[A-Za-zÀ-ÿ]/.test(s);

// ---------- Texto ----------
function abrirTexto(i) {
  idxTexto = i; textoAtual = textos[i];
  acertos = 0; respondidas = 0;
  const d = new Date();
  atual = { i, inicio: Date.now(), hora: String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'), respondidas: 0, acertos: 0 };
  tentativas.push(atual);
  document.getElementById('tituloTexto').textContent = textoAtual.emoji + ' ' + textoAtual.titulo;
  construirTexto();
  mostrar('leitura');
}

function construirTexto() {
  const corpo = document.getElementById('corpoTexto');
  corpo.innerHTML = '';
  textoAtual.frases.forEach(frase => {
    const linha = document.createElement('div');
    linha.className = 'linha';
    frase.split(' ').forEach(pal => {
      const span = document.createElement('span');
      if (!temLetras(pal)) { span.className = 'pont'; span.textContent = pal; linha.appendChild(span); return; }
      span.className = 'palavra';
      span.dataset.pal = pal;
      if (modoSilabas) {
        pal.split('·').forEach(sil => {
          const s = document.createElement('span');
          s.className = 'silaba'; s.textContent = sil; span.appendChild(s);
        });
      } else span.textContent = pal.replace(/·/g, '');
      span.onclick = () => tocarPalavra(span);
      linha.appendChild(span);
    });
    corpo.appendChild(linha);
  });
}

function limpar() { document.querySelectorAll('.ativa').forEach(e => e.classList.remove('ativa')); }

function tocarPalavra(span) {
  aLer = false; limpar();
  const pal = span.dataset.pal;
  if (modoSilabas) {
    const sils = pal.split('·'), spans = span.querySelectorAll('.silaba');
    let k = 0;
    const seguinte = () => {
      spans.forEach(s => s.classList.remove('ativa'));
      if (k < sils.length) {
        spans[k].classList.add('ativa');
        falar(sils[k], () => { k++; setTimeout(seguinte, 150); });
      } else {
        span.classList.add('ativa');
        falar(pal, () => span.classList.remove('ativa'));
      }
    };
    seguinte();
  } else {
    span.classList.add('ativa');
    falar(pal, () => span.classList.remove('ativa'));
  }
}

function ouvirTudo() {
  const palavras = Array.from(document.querySelectorAll('.palavra'));
  let i = 0; aLer = true;
  const seguinte = () => {
    if (!aLer) return;
    limpar();
    if (i < palavras.length) {
      palavras[i].classList.add('ativa');
      falar(palavras[i].dataset.pal, () => { i++; setTimeout(seguinte, 100); });
    } else aLer = false;
  };
  seguinte();
}

function alternarSilabas() {
  modoSilabas = !modoSilabas;
  document.getElementById('btnSil').classList.toggle('ativo', modoSilabas);
  construirTexto();
}

// ---------- Perguntas (só escritas, sem voz) ----------
function baralhar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function perguntaAtual() { return textoAtual.perguntas[qIdx]; }

function comecarPerguntas() {
  aLer = false; calar();
  qIdx = 0; acertos = 0; respondidas = 0; respostasLog = [];
  if (atual) { atual.respondidas = 0; atual.acertos = 0; }
  mostrar('perguntas');
  mostrarPergunta();
}

function feedback(txt, bom) {
  const f = document.getElementById('feedback');
  f.textContent = txt;
  f.className = 'feedback ' + (bom ? 'bom' : 'mau');
}

function mostrarPergunta() {
  errouEsta = false; primeiraResposta = null;
  const q = perguntaAtual();
  const nomes = { escolha: '🔵 Escolhe a resposta certa', vf: '✅ Verdadeiro ou falso?', ordem: '🔢 Ordena a história' };
  document.getElementById('progresso').textContent = `Pergunta ${qIdx + 1} de ${textoAtual.perguntas.length}`;
  document.getElementById('tipoPergunta').textContent = nomes[q.tipo];
  document.getElementById('textoPergunta').textContent = q.p;
  feedback('', true);
  const zona = document.getElementById('zonaResposta');
  zona.innerHTML = '';
  if (q.tipo === 'escolha') montarEscolha(zona, q);
  else if (q.tipo === 'vf') montarVF(zona, q);
  else montarOrdem(zona, q);
}

function errou(btn) {
  if (!errouEsta) primeiraResposta = btn.textContent;
  errouEsta = true;
  btn.classList.remove('errada'); void btn.offsetWidth; btn.classList.add('errada');
  feedback('Ainda não. Lê outra vez! 👀', false);
}

function acertou() {
  const q = perguntaAtual();
  const certa = q.tipo === 'escolha' ? q.o[0] : q.tipo === 'vf' ? (q.certo ? 'Verdadeiro' : 'Falso') : q.o.join(' → ');
  respostasLog.push({ n: qIdx + 1, p: q.p, d: errouEsta ? (q.tipo === 'ordem' ? 'Escolheu primeiro: ' : '') + primeiraResposta : certa, c: certa, ok: !errouEsta });
  respondidas++;
  if (!errouEsta) acertos++;
  if (atual) { atual.respondidas = respondidas; atual.acertos = acertos; }
  document.querySelectorAll('#zonaResposta .opcao').forEach(o => o.onclick = null);
  feedback(errouEsta ? 'Isso! 👍' : 'Muito bem! 🎉', true);
  setTimeout(proxima, 1100);
}

function montarEscolha(zona, q) {
  const box = document.createElement('div'); box.className = 'opcoes';
  baralhar(q.o).forEach(op => {
    const b = document.createElement('button');
    b.className = 'opcao'; b.textContent = op;
    b.onclick = () => { if (op === q.o[0]) { b.classList.add('certa'); acertou(); } else errou(b); };
    box.appendChild(b);
  });
  zona.appendChild(box);
}

function montarVF(zona, q) {
  const box = document.createElement('div'); box.className = 'opcoes vf';
  [['Verdadeiro', true], ['Falso', false]].forEach(([txt, val]) => {
    const b = document.createElement('button');
    b.className = 'opcao'; b.textContent = txt;
    b.onclick = () => { if (val === q.certo) { b.classList.add('certa'); acertou(); } else errou(b); };
    box.appendChild(b);
  });
  zona.appendChild(box);
}

function montarOrdem(zona, q) {
  let proximo = 0;
  const lugares = document.createElement('div'); lugares.className = 'ordem-lugares';
  const slots = q.o.map((_, i) => {
    const l = document.createElement('div'); l.className = 'lugar';
    l.innerHTML = `<span class="num">${i + 1}</span><span class="txt"></span>`;
    lugares.appendChild(l); return l;
  });
  const box = document.createElement('div'); box.className = 'opcoes';
  baralhar(q.o).forEach(frase => {
    const b = document.createElement('button');
    b.className = 'opcao'; b.textContent = frase;
    b.onclick = () => {
      if (frase === q.o[proximo]) {
        slots[proximo].classList.add('cheio');
        slots[proximo].querySelector('.txt').textContent = frase;
        b.classList.add('usada');
        feedback('', true);
        proximo++;
        if (proximo === q.o.length) acertou();
      } else errou(b);
    };
    box.appendChild(b);
  });
  zona.appendChild(lugares);
  zona.appendChild(box);
}

function proxima() {
  qIdx++;
  if (qIdx < textoAtual.perguntas.length) mostrarPergunta();
  else mostrarFinal();
}

function voltarAoTexto() { mostrar('leitura'); }

// ---------- Final ----------

function mostrarFinal() {
  const total = textoAtual.perguntas.length;
  const n = estrelasDe(acertos, total);
  melhores[idxTexto] = Math.max(melhores[idxTexto] || 0, n);
  mostrar('final');
  const e = document.getElementById('estrelas');
  e.textContent = '';
  for (let k = 0; k < 3; k++) setTimeout(() => { e.textContent += k < n ? '⭐' : '☆'; }, k * 400);
  const msgs = ['Vamos ler outra vez, Duarte!', 'Boa, Duarte! Continua a treinar!', 'Muito bem, Duarte!', 'Fantástico, Duarte! Acertaste tudo!'];
  document.getElementById('msgFinal').textContent = `${msgs[n]} Acertaste ${acertos} de ${total} à primeira.`;
  registar(total);
}

// ---------- Guardar no Firebase (projeto leitura-1m, junto com o TPC) ----------
let respostasLog = [], primeiraResposta = null;
const CHAVE = 'le-com-o-duarte-pendentes';
function lerPend() { try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { return []; } }
function gravarPend(l) { try { localStorage.setItem(CHAVE, JSON.stringify(l)); } catch (e) {} }
let pendentes = lerPend();
function setSave(t) { const e = document.getElementById('saveSt'); if (e) e.textContent = t; }
function registar(total) {
  const inicio = atual && atual.inicio ? atual.inicio : Date.now();
  pendentes.push({
    aluno: 'Duarte', app: 'Lê com o Duarte', tema: 'leitura-duarte',
    temaNome: '📖 ' + textoAtual.titulo, certas: acertos, total,
    quando: new Date().toISOString(), inicio: new Date(inicio).toISOString(),
    seg: Math.round((Date.now() - inicio) / 1000), respostas: respostasLog.slice()
  });
  gravarPend(pendentes);
  setSave('⏳ A guardar…');
  enviarPendentes();
}
let aEnviar = false;
async function enviarPendentes() {
  if (aEnviar || !pendentes.length) return;
  if (!window.FB) { setSave('💾 Ficou guardado. Segue para o professor quando houver internet.'); return; }
  aEnviar = true;
  try {
    while (pendentes.length) { await window.FB.save(pendentes[0]); pendentes.shift(); gravarPend(pendentes); }
    setSave('✅ O professor já recebeu o teu resultado!');
  } catch (e) { setSave('💾 Ficou guardado. Segue para o professor quando houver internet.'); }
  aEnviar = false;
}
window.addEventListener('fb-ready', enviarPendentes);
window.addEventListener('online', enviarPendentes);

// ---------- Relatório (professor e família) ----------
const PIN = '2026';
let REL = [];
const escH = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fData = d => new Date(d).toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fHora = d => new Date(d).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
const fDur = x => x == null ? '' : Math.floor(x / 60) + ' min ' + String(x % 60).padStart(2, '0') + ' s';
const estr = r => { const n = estrelasDe(r.certas, r.total); return '⭐'.repeat(n) + '☆'.repeat(3 - n); };
const titulo = r => String(r.temaNome || '').replace(/^📖\s*/, '');

function abrirRel() {
  aLer = false; calar(); mostrar('relatorio');
  document.getElementById('relPin').style.display = '';
  document.getElementById('relDados').style.display = 'none';
  document.getElementById('pin').value = '';
}
function entrarRel() {
  if (document.getElementById('pin').value !== PIN) { alert('PIN errado'); return; }
  document.getElementById('relPin').style.display = 'none';
  document.getElementById('relDados').style.display = '';
  carregarRel();
}
async function carregarRel() {
  const out = document.getElementById('relConteudo');
  out.innerHTML = '<p class="sub">A carregar…</p>';
  let lista = [];
  if (window.FB && window.FB.load) {
    try { lista = await window.FB.load(); }
    catch (e) { out.innerHTML = '<p class="sub">Não consegui ler os resultados (' + escH(e.code || e.message) + '). Verifica a internet.</p>'; return; }
  } else if (!pendentes.length) {
    out.innerHTML = '<p class="sub">Sem ligação. Verifica a internet e volta a entrar.</p>'; return;
  }
  REL = lista.filter(r => r.tema === 'leitura-duarte')
    .concat(pendentes.map(r => ({ ...r, pendente: true })));
  desenharRel();
}
function filtrados() {
  const dias = +document.getElementById('fDias').value, lim = dias ? Date.now() - dias * 864e5 : 0;
  return REL.filter(r => new Date(r.quando).getTime() >= lim).sort((a, b) => b.quando.localeCompare(a.quando));
}
function contas(R) {
  const certas = R.reduce((a, r) => a + r.certas, 0), perg = R.reduce((a, r) => a + r.total, 0);
  return { textos: R.length, dias: new Set(R.map(r => fData(r.quando))).size,
    pct: perg ? Math.round(certas / perg * 100) : 0, seg: R.reduce((a, r) => a + (r.seg || 0), 0) };
}
function periodoTxt() { const o = document.getElementById('fDias'); return o.options[o.selectedIndex].text; }
function desenharRel() {
  const R = filtrados(), c = contas(R), out = document.getElementById('relConteudo');
  if (!R.length) { out.innerHTML = '<p class="sub" style="margin-top:14px">Ainda não há textos lidos neste período.</p>'; return; }
  let h = `<div class="resumo">
    <div><b>${c.textos}</b><span>textos lidos</span></div>
    <div><b>${c.dias}</b><span>dias de leitura</span></div>
    <div><b>${c.pct}%</b><span>certas à primeira</span></div>
    <div><b>${Math.round(c.seg / 60)}</b><span>minutos no total</span></div></div>`;
  h += R.map(r => `<details class="leit"><summary><b>${escH(titulo(r))}</b> ${estr(r)}<br><small>${fData(r.quando)} às ${fHora(r.quando)} · ${r.certas}/${r.total} à primeira · ${fDur(r.seg)}${r.pendente ? ' · ainda não enviado' : ''}</small></summary>` +
    (r.respostas || []).map(x => `<div class="resp ${x.ok ? '' : 'x'}">${x.ok ? '✔' : '✗'} ${x.n}. ${escH(x.p)}<br><small>Respondeu: ${escH(x.d)}${x.ok ? '' : ' · Certa: ' + escH(x.c)}</small></div>`).join('') + '</details>').join('');
  out.innerHTML = h;
}
function baixarPDF() {
  const R = filtrados().slice().reverse();
  if (!R.length) { alert('Não há textos neste período.'); return; }
  const c = contas(R);
  let h = `<h1>Lê com o Duarte — relatório de leitura</h1>
    <p class="mut">${escH(periodoTxt())} · gerado a ${fData(new Date())} às ${fHora(new Date())}</p>
    <table><tr><th>Textos lidos</th><th>Dias de leitura</th><th>Certas à primeira</th><th>Tempo total</th></tr>
    <tr><td>${c.textos}</td><td>${c.dias}</td><td>${c.pct}%</td><td>${fDur(c.seg)}</td></tr></table>`;
  for (const r of R) {
    h += `<h2>${fData(r.quando)} ${fHora(r.quando)} · ${escH(titulo(r))} · ${r.certas}/${r.total} à primeira ${estr(r)} · ${fDur(r.seg)}</h2>
      <table><tr><th style="width:5%">N.º</th><th>Pergunta</th><th style="width:26%">Respondeu</th><th style="width:26%">Resposta certa</th><th style="width:5%"></th></tr>` +
      (r.respostas || []).map(x => `<tr><td>${x.n}</td><td>${escH(x.p)}</td><td>${escH(x.d)}</td><td>${escH(x.c)}</td><td class="${x.ok ? 'ok' : 'no'}">${x.ok ? '✔' : '✗'}</td></tr>`).join('') + '</table>';
  }
  document.getElementById('printArea').innerHTML = h;
  setTimeout(() => window.print(), 100);
}
function carregarScript(src) { return new Promise((ok, ko) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = ko; document.head.appendChild(e); }); }
async function baixarExcel() {
  const R = filtrados().slice().reverse();
  if (!R.length) { alert('Não há textos neste período.'); return; }
  try { if (!window.XLSX) await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
  catch (e) { alert('Não consegui abrir o Excel. Verifica a internet.'); return; }
  const textosF = R.map(r => ({ Data: fData(r.quando), Hora: fHora(r.quando), Texto: titulo(r), 'Certas à primeira': r.certas, Perguntas: r.total, Estrelas: estrelasDe(r.certas, r.total), Tempo: fDur(r.seg) }));
  const resp = []; R.forEach(r => (r.respostas || []).forEach(x => resp.push({ Data: fData(r.quando), Hora: fHora(r.quando), Texto: titulo(r), 'N.º': x.n, Pergunta: x.p, Respondeu: x.d, 'Resposta certa': x.c, 'Certo?': x.ok ? '✔' : '✗' })));
  const wb = XLSX.utils.book_new(), add = (rows, nome, w) => { const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = w.map(x => ({ wch: x })); XLSX.utils.book_append_sheet(wb, ws, nome); };
  add(textosF, 'Textos', [11, 7, 24, 16, 10, 9, 12]);
  add(resp, 'Respostas', [11, 7, 24, 5, 40, 40, 40, 7]);
  XLSX.writeFile(wb, 'Leitura_Duarte_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}
